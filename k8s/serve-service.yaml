apiVersion: v1
kind: Service
metadata:
  name: my-housing-app-service
spec:
  type: NodePort
  selector:
    app: housing-app  # 👈 This matches the metadata.labels.app from your deployment!
  ports:
    - port: 80         # Port exposed inside the cluster
      targetPort: 5000   # Port the container is running on
      nodePort: 30080  # Optional: A specific port (30000-32767) to open on your local machine
